name: Post-Earnings Refresh

on:
  schedule:
    # 01:30 UTC Tue-Sat = 9:30 PM ET the prior weekday, after AMC reports
    # have settled. Catches the day's after-market-close prints cleanly.
    - cron: '30 01 * * 2-6'
  workflow_dispatch:
    inputs:
      ticker:
        description: 'Backfill a single ticker on demand (optional)'
        required: false
        default: ''

env:
  PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
  FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
  USE_PPLX_API: 'true'
  PERPLEXITY_REASONING_EFFORT: 'low'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SIGNALAI_GH_PAT || secrets.GITHUB_TOKEN }}
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install yfinance requests python-dateutil openai python-dotenv

      - name: Run post-earnings refresh
        run: |
          if [ -n "${{ github.event.inputs.ticker }}" ]; then
            python -m automation.jobs.post_earnings_refresh --ticker "${{ github.event.inputs.ticker }}"
          else
            python -m automation.jobs.post_earnings_refresh
          fi

      - name: Commit refreshed data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto: post-earnings refresh $(date -u +%Y-%m-%d)"
          # Stage everything the refresh touches EXCEPT the pending_tasks queue,
          # which must never be auto-committed.
          file_pattern: >-
            earnings_intel.json
            earnings_calendar.json
            earnings_notes_index.json
            notes/post_earnings/
            cron_tracking/post_earnings_refresh/

      - name: Dump logs on failure
        if: ${{ failure() }}
        run: |
          echo "::group::Last 50 lines of post_earnings_refresh logs"
          latest=$(ls -t cron_tracking/post_earnings_refresh/*.log 2>/dev/null | head -1)
          if [ -n "$latest" ]; then
            echo "--- $latest ---"
            tail -n 50 "$latest"
          else
            echo "No log files found under cron_tracking/post_earnings_refresh/"
          fi
          echo "::endgroup::"
