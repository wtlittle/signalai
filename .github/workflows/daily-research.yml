name: Daily Research Refresh

on:
  schedule:
    # Two distinct GitHub-hosted cron slots, gated by REFRESH_MODE below.
    # The Perplexity-Computer-managed crons (BMO 9 AM ET, AMC 6:15 PM ET)
    # remain the primary refresh path; these workflow_run slots act as a
    # repo-side safety net that always pushes a clean commit even if the
    # Computer cron is unavailable.
    - cron: '0 10 * * 1-5'   # 6am ET  weekdays — BMO run (pre-market)
    - cron: '30 21 * * 1-5'  # 5:30pm ET weekdays — AMC run (post-close)
  workflow_dispatch:
    inputs:
      force_regenerate:
        description: 'Regenerate all notes even if they exist'
        required: false
        default: 'false'
      dry_run:
        description: 'Print actions without writing files or calling APIs'
        required: false
        default: 'false'
      notes_only:
        description: 'Run only note generation (skip market data refresh)'
        required: false
        default: 'false'

env:
  # API mode: when PERPLEXITY_API_KEY is set, automation/perplexity/client.py
  # routes calls directly to api.perplexity.ai with the per-task model map
  # (sonar-reasoning-pro for earnings notes, sonar-deep-research for weekly
  # briefing). When the secret is absent, calls fall back to queuing into
  # automation/queue/pending_tasks.json for Perplexity Computer to handle.
  PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
  USE_PPLX_API: 'true'
  # Keep automated runs on low reasoning effort to control monthly spend.
  # Override via workflow_dispatch input or per-job env if needed.
  PERPLEXITY_REASONING_EFFORT: 'low'
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
  FORCE_REGENERATE: ${{ github.event.inputs.force_regenerate || 'false' }}
  DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
  MAX_PRE_EARNINGS_DAYS: '14'
  MAX_POST_EARNINGS_DAYS: '14'
  # REFRESH_MODE is set per-run by the "Set REFRESH_MODE" step below. The
  # previous expression-based ternary collapsed to a boolean inside GitHub
  # Actions, which made every scheduled run silently fall back to "full".

# Grant the workflow's GITHUB_TOKEN write access to repository contents so
# the commit/push step at the end can land changes on main. Without this
# block the default token is read-only on repos created after 2023 and
# `git push` returns 403 for github-actions[bot].
permissions:
  contents: write
  issues: write  # needed by the auto-debug failure step to open issues

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Bumped from 30 to 90: a force_regenerate run can call the Perplexity
    # API ~100+ times (pre + post earnings windows combined) at ~10-15s per
    # call, so 30 min wasn't enough headroom for the manual backfill path.
    timeout-minutes: 90

    steps:
      - name: Set REFRESH_MODE
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "${{ github.event.schedule }}" = "0 10 * * 1-5" ]; then
              echo "REFRESH_MODE=bmo" >> $GITHUB_ENV
            elif [ "${{ github.event.schedule }}" = "30 21 * * 1-5" ]; then
              echo "REFRESH_MODE=amc" >> $GITHUB_ENV
            else
              echo "REFRESH_MODE=full" >> $GITHUB_ENV
            fi
          else
            echo "REFRESH_MODE=full" >> $GITHUB_ENV
          fi

      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # If SIGNALAI_GH_PAT secret is present (classic PAT with repo scope
          # or fine-grained PAT with Contents: Read and write), use it so the
          # push can bypass branch-protection rules that require PR review.
          # Otherwise fall back to the workflow GITHUB_TOKEN (granted write
          # access via the permissions block above).
          token: ${{ secrets.SIGNALAI_GH_PAT || secrets.GITHUB_TOKEN }}
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python dependencies
        run: pip install requests yfinance python-dotenv

      - name: Install Node dependencies
        run: npm install @supabase/supabase-js

      - name: Run daily refresh
        if: ${{ github.event.inputs.notes_only != 'true' }}
        run: python -m automation.jobs.daily_refresh

      - name: Run notes only
        if: ${{ github.event.inputs.notes_only == 'true' }}
        # Read directly from the already-committed earnings_calendar.json
        # rather than re-running event detection. Both pre_earnings_notes
        # and post_earnings_notes consume the calendar JSON directly, so
        # an extra earnings_events invocation here was redundant work
        # that could also flip same-day BMO/AMC categorisation back to
        # "pre" before the notes step had a chance to run.
        run: |
          python -m automation.jobs.pre_earnings_notes
          python -m automation.jobs.post_earnings_notes

      - name: Capture failure log + open auto-debug issue
        # Runs only when an earlier step in this job failed. Posts a GitHub
        # issue labelled "auto-debug" so the Perplexity Computer side can
        # detect failed runs without polling Actions API. The issue body
        # has the run URL, the failed job step, and the last 200 lines of
        # the runner log (downloaded via the Actions API using the job's
        # GITHUB_TOKEN). Closes itself the next time the same workflow
        # succeeds (handled by the success-side close step below).
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ secrets.SIGNALAI_GH_PAT || secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
          WORKFLOW: ${{ github.workflow }}
        run: |
          set +e
          mkdir -p /tmp/autodbg
          # Grab the runner's log archive for this run. The zip contains one
          # .txt file per job step. We only need the tail to keep the issue
          # body under GitHub's 65KB limit.
          curl -sSL -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -o /tmp/autodbg/logs.zip \
            "https://api.github.com/repos/${REPO}/actions/runs/${RUN_ID}/logs" || true
          TAIL_FILE=/tmp/autodbg/tail.txt
          if [ -s /tmp/autodbg/logs.zip ]; then
            cd /tmp/autodbg && unzip -q logs.zip -d unpacked || true
            # Concatenate every step log, tail to last 250 lines.
            find unpacked -name '*.txt' -print0 | xargs -0 cat 2>/dev/null | tail -n 250 > "$TAIL_FILE"
          fi
          [ -s "$TAIL_FILE" ] || echo "(log fetch failed — see run page)" > "$TAIL_FILE"
          # Compose issue body.
          {
            echo "## Daily refresh failed"
            echo ""
            echo "- **Workflow:** ${WORKFLOW}"
            echo "- **Run:** https://github.com/${REPO}/actions/runs/${RUN_ID}"
            echo "- **Branch:** ${REF}"
            echo "- **Mode:** ${REFRESH_MODE:-unknown}"
            echo "- **When:** $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo ""
            echo "### Log tail (last 250 lines, all steps)"
            echo '```'
            cat "$TAIL_FILE"
            echo '```'
          } > /tmp/autodbg/body.md
          TITLE="[auto-debug] daily refresh failed — $(date -u +%Y-%m-%d) (run ${RUN_ID})"
          # If an open auto-debug issue from today already exists, append a
          # comment instead of opening a duplicate.
          TODAY=$(date -u +%Y-%m-%d)
          EXISTING=$(curl -sSL -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/issues?labels=auto-debug&state=open&per_page=100" \
            | python3 -c "import sys,json; ds=json.load(sys.stdin); print(next((i['number'] for i in ds if '${TODAY}' in i.get('title','')), ''))" 2>/dev/null)
          if [ -n "$EXISTING" ]; then
            echo "Appending to existing issue #$EXISTING"
            python3 -c "import json,sys; print(json.dumps({'body': open('/tmp/autodbg/body.md').read()}))" \
              | curl -sSL -X POST -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -H "Content-Type: application/json" \
                -d @- \
                "https://api.github.com/repos/${REPO}/issues/${EXISTING}/comments" > /dev/null
          else
            echo "Opening new auto-debug issue"
            python3 -c "import json,sys; print(json.dumps({'title': '${TITLE}', 'body': open('/tmp/autodbg/body.md').read(), 'labels': ['auto-debug', 'daily-refresh']}))" \
              | curl -sSL -X POST -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -H "Content-Type: application/json" \
                -d @- \
                "https://api.github.com/repos/${REPO}/issues" > /dev/null
          fi
          # Always exit 0 so this step doesn't itself fail the workflow.
          exit 0

      - name: Upload generated notes as artifact
        # Always upload — even when the push step below is blocked by branch
        # protection — so the produced notes don't get thrown away with the
        # runner. The parent agent can pull this artifact down and commit it
        # via a path that bypasses protection.
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: generated-notes-${{ github.run_id }}
          path: |
            notes/
            earnings_notes_index.json
            earnings_calendar.json
            earnings_data.json
            earnings_intel.json
            weekly_briefing.json
            macro_data.json
            data-snapshot.json
          retention-days: 7
          if-no-files-found: warn

      - name: Close stale auto-debug issues on success
        # When the workflow finishes without a failure, close any open
        # auto-debug issues. Keeps the issue list tidy so a single "open"
        # issue == "current daily refresh is broken".
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ secrets.SIGNALAI_GH_PAT || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set +e
          OPEN=$(curl -sSL -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/issues?labels=auto-debug&state=open&per_page=100" \
            | python3 -c "import sys,json; print(' '.join(str(i['number']) for i in json.load(sys.stdin)))" 2>/dev/null)
          for N in $OPEN; do
            echo "Closing #$N"
            python3 -c "import json; print(json.dumps({'state':'closed','state_reason':'completed'}))" \
              | curl -sSL -X PATCH -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -H "Content-Type: application/json" \
                -d @- \
                "https://api.github.com/repos/${REPO}/issues/${N}" > /dev/null
            python3 -c "import json; print(json.dumps({'body':'Auto-closed by successful run https://github.com/${REPO}/actions/runs/${RUN_ID}.'}))" \
              | curl -sSL -X POST -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -H "Content-Type: application/json" \
                -d @- \
                "https://api.github.com/repos/${REPO}/issues/${N}/comments" > /dev/null
          done
          exit 0

      - name: Commit generated notes and data
        run: |
          git config user.name "signalai-bot"
          git config user.email "bot@signalai"
          git add notes/ data/ archive/ automation/queue/ \
            earnings_notes_index.json \
            earnings_calendar.json \
            earnings_data.json \
            earnings_intel.json \
            weekly_briefing.json \
            macro_data.json \
            data-snapshot.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: daily refresh $(date -u +%Y-%m-%d)"
            # Rebase-pull in case a parallel push (weekly briefing or
            # manual dispatch) landed while this run was working.
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}" || \
              echo "::warning::Push to ${GITHUB_REF_NAME} was rejected; artifact upload covers the generated notes."
          fi
